version: 2
updates:
  # One npm entry covers the whole workspace: the root package.json declares
  # `workspaces: ["packages/*", "benchmark"]`, so Dependabot resolves every
  # package through the root lockfile rather than needing 15 directory entries.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Dev tooling churns constantly and is not shipped to users. Grouping it
      # keeps the review queue about the dependencies that reach consumers.
      dev-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # Every workflow lives in .github/workflows/, so Dependabot sees them all.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
