name: Bug report
description: Something behaves differently from what the docs say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A reproduction is worth more than a description. The smallest one that
        still fails is the most useful thing you can attach.

  - type: input
    id: version
    attributes:
      label: Version
      description: "Output of `npm ls what-framework what-core` (or the package you are using)."
      placeholder: what-core@0.12.4
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where it happens
      options:
        - Client only
        - SSR / hydration
        - Build (compiler or CLI)
        - Server actions
        - Islands
        - React compat
        - Devtools / MCP
        - Not sure
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        A link to a repo or a code block that fails. If it needs a build step,
        `npx create-what` plus the smallest diff is ideal.
      render: jsx
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
      placeholder: |
        Expected: the count re-renders when the signal changes
        Actual: the initial value stays on screen
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error output
      description: >
        The full message and stack. If it carries an `ERR_*` code, include it —
        that code resolves to a suggestion and an example.
      render: shell

  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Node 22.13.1, macOS 15, Vite 7.3.5, Chrome 141"
