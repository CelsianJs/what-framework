# THIS is the publisher, and it is the only one. Unlike ci/size/benchmarks,
# release-and-deploy has no Depot counterpart, on purpose:
#
#   1. `secrets.NPM_TOKEN` is a GitHub repository secret. A Depot run resolves
#      it to the empty string and `publish-packages.mjs` exits 1 with
#      "Missing npm auth" AFTER burning ~10 minutes of green quality gates.
#      That is exactly what happened on the first 0.13.0 publish attempt.
#   2. npm provenance is minted from GitHub's OIDC issuer via the
#      `id-token: write` permission below. Publishing anywhere else silently
#      drops provenance from every tarball.
#
# Dispatch it with:
#   gh workflow run release-and-deploy.yml --repo CelsianJs/what-framework \
#     --ref main -f publish_packages=true -f npm_tag=latest -f dry_run=false
name: Release And Deploy

on:
  workflow_dispatch:
    inputs:
      publish_packages:
        description: Publish packages to npm
        required: true
        default: true
        type: boolean
      npm_tag:
        description: npm dist-tag for publish
        required: false
        default: latest
        type: string
      dry_run:
        description: Run without publishing/deploying
        required: true
        default: false
        type: boolean

concurrency:
  group: release-and-deploy-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # npm_tag is free-form dispatch input. Reject anything that is not a
      # plain dist-tag before it reaches a step that holds NPM_TOKEN.
      - name: Validate npm dist-tag input
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          if [ -n "$NPM_TAG" ] && ! printf '%s' "$NPM_TAG" | grep -Eq '^[a-z][a-z0-9]*([._-][a-z0-9]+)*$'; then
            echo "Invalid npm_tag: '$NPM_TAG' (expected a dist-tag like latest, next, beta.1)"
            exit 1
          fi

      # publish-packages.mjs checks npm auth, but only once the ~10 minutes of
      # quality gates below have already run. Check it here instead, so a
      # missing or expired token costs seconds.
      - name: Preflight npm auth
        if: ${{ inputs.publish_packages && !inputs.dry_run }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "secrets.NPM_TOKEN is empty. This workflow must run on GitHub"
            echo "Actions (the secret lives there), and the token must be a"
            echo "classic Automation token so it does not expire."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # A publish run MUST have a real browser. playwright has no postinstall, so
      # `npm ci` installs the library and no browser at all. Without this step the
      # three browser-backed gates below do not fail, they silently DEGRADE on the
      # exact run that ships to npm: devtools-mcp's 6 Browser->Bridge->MCP e2e
      # tests and devtools' 9 tests flip to describe.skip, and smoke:scaffold
      # catches the launch failure and falls back to an HTTP-only marker check,
      # skipping SSR hydration, the server-action round trip and the ISR cache
      # assertion entirely. The run still prints green. Every browser-needing job
      # in ci.yml already does this; only the publish path was missing it.
      - name: Install Playwright Chromium (release gates need a real browser)
        run: npx playwright install --with-deps chromium

      - name: Verify quality gates (correctness — blocking)
        # Every correctness gate from release:verify EXCEPT bench:gate. The
        # checked-in perf baselines are recorded on fast local hardware (M3 Max);
        # GitHub shared runners are several× slower on some microbenchmarks
        # (e.g. `batch() 100 writes`), so bench:gate false-fails here and must
        # not block a publish. On CI the `bench-gate` job in ci.yml runs the same
        # gate as a visible-but-non-blocking signal; perf is gated strictly by
        # `release:verify` on local hardware.
        env:
          # Turn a missing browser into a hard failure rather than a silent
          # downgrade, so this gate can never again pass without having run.
          WHAT_SMOKE_REQUIRE_BROWSER: 1
          WHAT_REQUIRE_BROWSER_TESTS: 1
        run: |
          npm run -s hygiene:publish
          npm run -s test
          npm run -s build
          npm run -s hygiene:publish
          npm run -s check:size
          npm run -s test:prod
          npm run -s smoke:scaffold
          npm run -s smoke:apps

      - name: Benchmark gate (perf — non-blocking signal)
        continue-on-error: true
        # The DOM stage is skipped on the publish path (it needs a browser and
        # several minutes for a signal that cannot block here anyway). It runs on
        # every push in ci.yml's bench-gate job, and blocks in `release:verify`
        # on local hardware.
        env:
          WHAT_BENCH_TOLERANCE_CORE: 0.80
          WHAT_BENCH_TOLERANCE_DX: 0.85
          WHAT_BENCH_SKIP_DOM: 1
        run: npm run -s bench:gate

      - name: Publish npm packages
        if: ${{ inputs.publish_packages }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ inputs.npm_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$NPM_TAG" ]; then
            ARGS+=(--tag "$NPM_TAG")
          fi
          node scripts/publish-packages.mjs "${ARGS[@]}"

      - name: Verify npm registry packages
        if: ${{ inputs.publish_packages && !inputs.dry_run }}
        run: npm run -s verify:registry

      # The gate the 0.12.0 and 0.12.1 packaging defects needed and did not have.
      # Everything above this point tests the WORKSPACE, which resolves paths that
      # a published tarball may not contain: a types path declared but not shipped,
      # an export condition shadowed by another, a dependency that only resolves
      # inside the monorepo. This step installs what was just published and drives
      # the same applications against it. Runs after the publish because there is
      # nothing to install before one.
      - name: App smoke suite against the PUBLISHED packages
        if: ${{ inputs.publish_packages && !inputs.dry_run }}
        run: npm run -s smoke:apps:npm

      - name: Upload registry smoke artifact
        if: ${{ always() && inputs.publish_packages && !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: what-registry-smoke
          path: artifacts/registry-smoke.json
          if-no-files-found: error

      # Web surfaces (docs-site, benchmarks, playground, react-compat) deploy via
      # Vercel's Git integration on push — no VERCEL_TOKEN secret exists in this
      # repo and the .vercel project links are gitignored, so a CLI deploy step
      # can never work here. scripts/deploy-vercel.mjs remains for local use.
