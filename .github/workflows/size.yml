name: Size

# Runs on GitHub-hosted runners. This is a public repository, so GitHub-hosted
# minutes are free, and public repositories never use ZVN's self-hosted runners
# (a fork pull request could run code on them). Depot CI was retired here on
# 2026-10-19.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: size-${{ github.ref }}
  cancel-in-progress: true
jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production dist)
        run: node scripts/build.js

      - name: Check size budgets
        run: node scripts/check-size.mjs
