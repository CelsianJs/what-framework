name: Size

# Runs on Depot CI (.depot/workflows/) as of 2026-07-11 (Kirby's directive).
# This copy keeps workflow_dispatch as a manual fallback.
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: size-${{ github.ref }}
  cancel-in-progress: true
jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production dist)
        run: node scripts/build.js

      - name: Check size budgets
        run: node scripts/check-size.mjs
